common:
    lid_topic:  "/velodyne_points"
    imu_topic:  "/imu/data"      # default: /imu_data

preprocess:
    lidar_type: 2                #1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for L515 LiDAR
    scan_line: 16
    blind: 1
    point_filter_num: 1
    calib_laser: false              # true for KITTI Odometry dataset

mapping:
    down_sample_size: 0.2 # default: 0.5
    max_iteration: 3
    voxel_size: 1.0 # default: 3.0
    max_layer: 4                # 4 layer, 0, 1, 2, 3
    layer_point_size: [5, 5, 5, 5, 5]
    plannar_threshold: 0.01
    max_points_size: 1000
    max_cov_points_size: 1000

noise_model:
    ranging_cov: 0.04
    angle_cov: 0.1
    acc_cov_scale: 1.0
    gyr_cov_scale: 0.5

# SubT-MRS Multi-Floor setting
imu:
    imu_en: true
    extrinsic_T: [0.08, 0.029, 0.03]
    extrinsic_R: [0.999212900, -0.000519121,  0.004000000,
                  0.000516111,  0.999218492, -0.000939132,
                 -0.004000000,  0.000802565,  0.999993652]

visualization:
    pub_voxel_map: false                # default: false
    publish_max_voxel_layer: 1         # only publish 0,1,2 layer's plane
    pub_point_cloud: false              # default: false
    dense_map_enable: false
    pub_point_cloud_skip: 5            # publish one points per five points

Result:
    write_kitti_log: false
    result_path: "/home/ycj/catkin_github/src/VoxelMap/Log/kitt_log.txt"
